name: Live Supabase Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/r2-judicial-operations
    paths:
      - '.github/workflows/live-supabase-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DCIECMS_DATABASE_URL }}
      DCIECMS_DB_PROFILE: supabase_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require protected database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DCIECMS_DATABASE_URL repository secret is required."
            exit 1
          fi

      - name: Install backend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run transactional DCIECMS live smoke
        run: npm run smoke:live
