name: Live Supabase Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/r2-judicial-operations
    paths:
      - '.github/workflows/live-supabase-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DCIECMS_DATABASE_URL }}
      DCIECMS_DB_PROFILE: supabase_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Require protected database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DCIECMS_DATABASE_URL repository secret is required."
            exit 1
          fi

      - name: Diagnose database target safely
        shell: bash
        run: |
          node - <<'NODE'
          const u = new URL(process.env.DATABASE_URL);
          console.log(`db_user=${decodeURIComponent(u.username)}`);
          console.log(`db_host=${u.hostname}`);
          console.log(`db_port=${u.port || '5432'}`);
          console.log(`db_name=${u.pathname.replace(/^\//, '')}`);
          NODE

      - name: Install backend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      # Verify transactional live smoke after PNG daily-list timezone correction.
      - name: Run transactional DCIECMS live smoke
        run: npm run smoke:live
