name: CI

on:
  push:
    branches:
      - main
      - feat/first-vertical-slice
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show runtime
        run: node --version

      - name: Run full test suite
        run: npm test
